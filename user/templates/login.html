{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="text-center">Вход</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p class="mb-1">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
                    <a href="{% url 'users:password_reset' %}" class="text-muted">Забыли пароль?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
